name: UI repair
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply repair
        run: python scripts/ui_repair.py
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Validate
        run: npm run build
      - name: Commit repair
        run: |
          git config user.name "Paulo Suero"
          git config user.email "pausuero29@gmail.com"
          git rm .github/workflows/ui-repair.yml scripts/ui_repair.py
          git add src/app/views/deck.ts src/app/views/planner.ts src/app/styles/staking.css
          git commit -m "fix: repair staking UI and output presentation"
          git push origin HEAD:main
