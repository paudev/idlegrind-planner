name: Output cleanup and QDC-S fix v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source fixes
        run: python .github/scripts/fix_output_qdc.py
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Validate
        run: npm run build
      - name: Commit fixes
        run: |
          git config user.name "Paulo Suero"
          git config user.email "pausuero29@gmail.com"
          git rm .github/workflows/fix-output-qdc-v2.yml .github/scripts/fix_output_qdc.py
          git add src/app/core/state.ts src/app/views/deck.ts tests/calculations.test.ts
          git commit -m "fix: simplify simulator changes and migrate QDC-S synergy"
          git push origin HEAD:main
