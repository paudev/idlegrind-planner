name: Presentation v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply presentation patch
        run: python scripts/presentation-v2.py
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Validate
        run: npm run build
      - name: Commit presentation
        run: |
          git config user.name "Paulo Suero"
          git config user.email "pausuero29@gmail.com"
          git rm .github/workflows/presentation-v2.yml scripts/presentation-v2.py
          git add src/app/views/deck.ts src/app/views/planner.ts
          git commit -m "refactor: clarify planner and simulator decision data"
          git push origin HEAD:main
