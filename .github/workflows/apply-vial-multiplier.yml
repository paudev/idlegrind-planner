name: Apply vial multiplier display
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply UI patch
        run: python scripts/add-vial-multiplier.py
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Validate
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "Paulo Suero"
          git config user.email "pausuero29@gmail.com"
          git rm .github/workflows/apply-vial-multiplier.yml scripts/add-vial-multiplier.py
          git add src/app/ui/components.ts src/app/views/deck.ts src/app/styles/presentation-fixes.css
          git commit -m "feat: show vial-active total multiplier"
          git push origin HEAD:main
